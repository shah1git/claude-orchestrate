# Portable owner-selected OMP profile.
# Authentication, setup completion, consent, sessions, and machine identifiers
# are deliberately absent; bootstrap-machine.sh restores only reusable behavior.
providers:
  webSearchOrder: []
  openaiWebsockets: auto
  kimiApiFormat: auto
  antigravityEndpoint: auto
  streamFirstEventTimeoutSeconds: -1
  streamIdleTimeoutSeconds: -1
  maxInFlightRequests:
    google-antigravity: 8
    openai-codex: 3
    anthropic: 3
    kimi-code: 3
    xai-oauth: 1
    alibaba-token-plan: 3
  autoThinkingMaxEffort: xhigh
modelRoles:
  default: alibaba-token-plan/qwen3.8-max
  smol: google-antigravity/gemini-3.6-flash:medium
  slow: anthropic/claude-fable-5:max
  free: google-antigravity/claude-opus-4-6:high
  plan: alibaba-token-plan/qwen3.8-max
  vision: openai-codex/gpt-5.6-sol:high
  designer: openai-codex/gpt-5.6-sol:high
  commit: google-antigravity/gemini-3.6-flash:medium
  tiny: google-antigravity/gemini-3.6-flash:medium
  task: openai-codex/gpt-5.6-terra:high
  advisor: xai-oauth/grok-4.5:high
  pocock-scout: kimi-code/kimi-for-coding-highspeed:high
  pocock-builder: openai-codex/gpt-5.6-terra:high
  pocock-architect: openai-codex/gpt-5.6-sol:max
  pocock-lens-standards: google-antigravity/gemini-3.6-flash:high
  pocock-lens-spec: alibaba-token-plan/qwen3.8-max
  pocock-lens-critic: anthropic/claude-fable-5:max
modelTags:
  free:
    name: AG Opus
    color: accent
modelProviderOrder:
  - openai-codex
  - anthropic
  - alibaba-token-plan
  - xai-oauth
  - google-antigravity
  - kimi-code
cycleOrder:
  - smol
  - default
  - free
  - plan
  - slow
defaultThinkingLevel: auto
contextPromotion:
  enabled: true
retry:
  enabled: true
  modelFallback: true
  maxRetries: 6
  baseDelayMs: 500
  maxDelayMs: 45000
  fallbackRevertPolicy: cooldown-expiry
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: auto
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-sol:high
      - kimi-code/k3:high
      - google-antigravity/gemini-3.1-pro:high
      - xai-oauth/grok-4.5:high
    smol:
      - openai-codex/gpt-5.6-luna:high
      - kimi-code/kimi-for-coding-highspeed:high
      - anthropic/claude-haiku-4-5:high
      - alibaba-token-plan/qwen3.8-max
    slow:
      - alibaba-token-plan/qwen3.8-max
      - anthropic/claude-opus-5:high
      - openai-codex/gpt-5.6-sol:max
      - xai-oauth/grok-4.5:high
      - kimi-code/k3:max
      - google-antigravity/gemini-3.1-pro:high
    free:
      - alibaba-token-plan/qwen3.8-max
      - google-antigravity/gemini-3.1-pro:high
    plan:
      - openai-codex/gpt-5.6-sol:max
      - xai-oauth/grok-4.5:high
      - kimi-code/k3:max
      - google-antigravity/gemini-3.1-pro:high
    vision:
      - anthropic/claude-opus-5:high
      - xai-oauth/grok-4.5:high
      - google-antigravity/gemini-3.1-pro:high
      - kimi-code/k3:high
    designer:
      - anthropic/claude-opus-5:high
      - alibaba-token-plan/qwen3.8-max
      - xai-oauth/grok-4.5:high
      - google-antigravity/gemini-3.1-pro:high
      - kimi-code/k3:high
    commit:
      - openai-codex/gpt-5.6-luna:low
      - kimi-code/kimi-for-coding-highspeed:low
      - anthropic/claude-haiku-4-5:low
      - alibaba-token-plan/qwen3.8-max
    tiny:
      - openai-codex/gpt-5.6-luna:low
      - kimi-code/kimi-for-coding-highspeed:minimal
      - anthropic/claude-haiku-4-5:minimal
      - alibaba-token-plan/qwen3.8-max
    task:
      - alibaba-token-plan/qwen3.8-max
      - anthropic/claude-opus-5:high
      - xai-oauth/grok-4.5:high
      - google-antigravity/claude-opus-4-6:high
      - kimi-code/k3:high
    advisor:
      - google-antigravity/gemini-3.6-flash:high
      - alibaba-token-plan/qwen3.8-max
      - anthropic/claude-opus-5:high
      - openai-codex/gpt-5.6-terra:high
      - kimi-code/k3:high
    pocock-scout: [alibaba-token-plan/deepseek-v4-pro:max, google-antigravity/gemini-3.5-flash:high]
    pocock-builder: [alibaba-token-plan/deepseek-v4-pro:max, google-antigravity/gemini-3.5-flash:high, anthropic/claude-opus-5:max]
    pocock-architect: [xai-oauth/grok-4.5:xhigh, google-antigravity/gemini-3.5-flash:high, anthropic/claude-opus-5:max, alibaba-token-plan/deepseek-v4-pro:max]
    pocock-lens-standards: [kimi-code/k3:high]
    pocock-lens-spec: [anthropic/claude-sonnet-5:high, google-antigravity/gemini-3.1-pro:high]
    pocock-lens-critic: [google-antigravity/gemini-3.1-flash-lite:high, alibaba-token-plan/glm-5.2:max]
task:
  eager: preferred
  maxConcurrency: 6
  maxRecursionDepth: 1
  maxRuntimeMs: 1800000
  enableEffort: true
  maxEffort: max
  batch: true
  isolation:
    mode: auto
    apply: false
    merge: patch
  showResolvedModelBadge: true
advisor:
  enabled: true
  subagents: false
  syncBacklog: "3"
  immuneTurns: 2
tier:
  openai: none
  anthropic: none
  google: none
  subagent: inherit
  advisor: none
symbolPreset: unicode
theme:
  light: light
async:
  enabled: false
display:
  showTokenUsage: true
