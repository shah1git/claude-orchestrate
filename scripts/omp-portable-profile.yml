# Portable owner-selected OMP profile.
# Authentication, setup completion, consent, sessions, and machine identifiers
# are deliberately absent; bootstrap-machine.sh restores only reusable behavior.
#
# Generated by scripts/export-portable-omp-profile.py from the live OMP config.
# Do not hand-edit: run the exporter on the machine whose behavior should travel,
# then commit the result. A hand edit reintroduces the drift the exporter removes.
providers:
  webSearchOrder: []
  openaiWebsockets: auto
  kimiApiFormat: auto
  antigravityEndpoint: auto
  streamFirstEventTimeoutSeconds: -1
  streamIdleTimeoutSeconds: -1
  maxInFlightRequests:
    google-antigravity: 8
    openai-codex: 3
    anthropic: 3
    kimi-code: 3
    xai-oauth: 1
    alibaba-token-plan: 3
  autoThinkingMaxEffort: xhigh
modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: openai-codex/gpt-5.6-luna:high
  slow: openai-codex/gpt-5.6-sol:max
  free: google-antigravity/claude-opus-4-6:high
  plan: openai-codex/gpt-5.6-sol:max
  vision: openai-codex/gpt-5.6-sol:high
  designer: openai-codex/gpt-5.6-sol:high
  commit: google-antigravity/gemini-3.6-flash:medium
  tiny: google-antigravity/gemini-3.6-flash:medium
  task: openai-codex/gpt-5.6-terra:high
  advisor: xai-oauth/grok-4.5:high
  pocock-scout: kimi-code/kimi-for-coding-highspeed:high
  pocock-builder: openai-codex/gpt-5.6-terra:high
  pocock-architect: openai-codex/gpt-5.6-sol:max
  pocock-lens-review: openai-codex/gpt-5.6-sol:max
  pocock-lens-critic: anthropic/claude-fable-5:max
